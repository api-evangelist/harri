      operationId: DeprecatedFranshiseesCreateEmployeeMaxWeeklyHours
      parameters:
        - name: franchiseeId
          in: path
          required: true
          schema:
            type: number
        - name: employeeId
          in: path
          description: employee id
          required: true
          schema:
            type: string
        - name: payTypeId
          in: path
          description: pay type id
          required: true
          schema:
            type: integer
            format: int64
        - name: locationId
          in: path
          description: >-
            location id, should be primary location id for employees with fixed
            pay type
          required: true
          schema:
            type: string
      requestBody:
        description: Employee Max Weekly Hours
        content:
          application/json:
            schema:
              type: object
              properties:
                max_weekly_hours:
                  type: object
                  properties:
                    value:
                      type: number
                    start_date:
                      type: string
                      format: date
                    working_pattern:
                      type: object
                      description: >
                        Defines the employee's working pattern. The value depends on the enabled options:
                        - If the WORKING_PATTERN service is **disabled**, the value should be omitted or set to `null`.
                        - Option 1: Specific hours with non-specific days → `{"days_count": 1, "working_pattern_days": []}`
                        - Option 2: Specific hours with flexible days → `{"days_count": null, "working_pattern_days": [{"day": "SUN", "hours_count": null}]}`
                        - Option 3: Specific hours with specific days → `{"days_count": null, "working_pattern_days": [{"day": "SUN", "hours_count": 8}]}`
                      properties:
                        days_count:
                          type: number
                          nullable: true
                          description: The number of working days per week value enum(1, 2, 3, 4, 5, 6, 7), it can be null but the key is required to be sent
                        working_pattern_days:
                          type: array
                          description: >
                            The distribution of working days. Can be an empty list if not specifying specific days.
                            Each item defines the day and optionally the number of hours worked.
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                nullable: false
                              hours_count:
                                type: number
                                nullable: true
                                description: The number of hours per day, it can be null but the key is required to be sent
                            required:
                              - day
                      required:
                        - days_count
                  required:
                    - value
                    - start_date
              required:
                - max_weekly_hours
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_weekly_hours:
                    $ref: '#/components/schemas/DeprecatedMaxWeeklyHoursV2'
