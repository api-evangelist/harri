      description: Create employee API
      operationId: CreateEmployeeV7
      requestBody:
        description: Employee data
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                id:
                  type: string
                  description: >-
                    A unique ID supplied by customers or third parties. If not
                    provided, Harri will generate one. This is supported only if
                    external mapping is enabled for the client.
                email:
                  type: string
                  format: email
                  description: >-
                    If phone number is not provided, employee email must be
                    provided.
                first_name:
                  type: string
                  description: employee first name
                last_name:
                  type: string
                  description: employee last name
                middle_name:
                  type: string
                  description: employee middle name
                known_as:
                  type: string
                birth_date:
                  type: string
                  format: date
                  description: employee birth date
                national_number:
                  type: string
                  description: national_number max length is 12 cahrechters
                phone:
                  type: string
                  format: phone
                  description: >-
                    If email is not provided, employee phone number must be
                    provided.
                home_phone:
                  type: string
                  format: phone
                  description: home phone number
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - NO_IDENTIFY
                  description: employee gender
                geid:
                  type: string
                address:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                    - type: object
                      properties:
                        county:
                          type: string
                      required:
                        - account_number
                        - postal_code
                        - country_code
                hire_date:
                  type: string
                  format: date
                  description: employee hire date
                bank_account:
                  type: object
                  properties:
                    routing_number:
                      type: string
                    account_number:
                      type: string
                    registration_number:
                      type: string
                    account_type:
                      type: string
                      enum:
                        - SAVINGS
                        - CHECKING
                    bank_name:
                      type: string
                    account_name:
                      type: string
                    sort_code:
                      type: string
                    bank_branch:
                      type: string
                  required:
                    - account_number
                job_titles:
                  type: array
                  items:
                    type: object
                    properties:
                      job_title_id:
                        type: number
