openapi: 3.0.1
info:
  title: Harri Employee OpenAPI
  description: >-
    API for managing and retrieving employee data in the Harri system.
    - Notice: Harri's API enforces a rate limit of 400 requests per minute. Once you exceed this limit, an HTTP 403 error is returned with a body that informs you that the limit has been exceeded. Please examine the API returns for this error so your software can respond appropriately.
    After 4 June, 2026, the rate limiting error will change from 403 to 429.
  termsOfService: https://harri.com/terms
  version: 1.0.0
servers:
  - url: https://gateway.harri.com/open-api-hub
components:
  schemas:
    Location:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        country_code:
          type: string
        state_code:
          type: string
        city:
          type: string
    Position:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: object
          properties:
            id:
              type: number
            code:
              type: string
            name:
              type: string
    CostCenter:
      type: object
      properties:
        id:
          type: number
        code:
          type: string
        name:
          type: string
        value:
          type: object
          properties:
            id:
              type: number
            code:
              type: string
            name:
              type: string
    Address:
      type: object
      properties:
        country_code:
          type: string
          example: US
        state_code:
          type: string
          example: NY
        city:
          type: string
        address_line_1:
          type: string
        address_line_2:
          type: string
        postal_code:
          type: string
    DeprecatedBankAccount:
      type: object
      properties:
        routing_number:
          type: string
          description: for US locations only
        account_number:
          type: string
        registration_number:
          type: string
          description: for DK locations
        account_type:
          type: string
          enum:
            - SAVINGS
            - CHECKING
          description: for US locations only
        bank_name:
          type: string
        account_name:
          type: string
          description: for non US locations
        sort_code:
          type: string
          description: for other US locations
    BankAccount:
      type: object
      properties:
        id:
          type: number
          description: employee bank account id
        order:
          type: number
          description: >-
            the order of the employee's bank account. An order value of 1
            signifies that this is the primary bank account.
        routing_number:
          type: string
          description: for US locations only
        account_number:
          type: string
        registration_number:
          type: string
          description: for DK locations
        account_type:
          type: string
          enum:
            - SAVINGS
            - CHECKING
          description: for US locations only
        bank_name:
          type: string
        account_name:
          type: string
          description: for non US locations
        sort_code:
          type: string
          description: for other US locations
        deposit_amount_type:
          type: string
          enum:
            - ENTIRE
            - PARTIAL
            - FIXED
          description: Specifies the type of deposit amount.
        amount:
          type: number
          nullable: true
          description: >-
            Represents the amount of money if deposit_amount_type is FIXED, the
            percentage if deposit_amount_type is PARTIAL, and is null if
            deposit_amount_type is ENTIRE.
        bank_branch:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
    JobTitle:
      type: object
      properties:
        id:
          type: number
        code:
          type: string
        name:
          type: string
        skill_needed:
          type: boolean
    TerminationReason:
      type: object
      properties:
        id:
          type: number
        code:
          type: string
        name:
          type: string
    TerminationReasonV2:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    TerminationReasonGroup:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        termination_reasons:
          type: array
          items:
            $ref: '#/components/schemas/TerminationReasonV2'
    EmployeeJobTitle:
      type: object
      allOf:
        - $ref: '#/components/schemas/JobTitle'
        - type: object
          properties:
            level:
              type: string
              description: number with quotations like "5"
    EmploymentPeriod:
      type: object
      properties:
        id:
          type: number
        hire_date:
          type: string
          format: date
          description: employee hire date
        leave_date:
          type: string
          format: date
          description: employee leave date
          nullable: true
        termination_reason:
          type: object
          nullable: true
          properties:
            code:
              type: string
            name:
              type: string
    LocationPeriod:
      type: object
      properties:
        id:
          type: number
        start_date:
          type: string
          format: date
          description: employee start date on specific location
        end_date:
          type: string
          format: date
          description: employee end date on specific location
          nullable: true
        type:
          type: string
          enum:
            - PRIMARY
            - SECONDARY
    DeprecatedHourlyRate:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        tronc:
          type: number
    DeprecatedHourlyRateV2:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        tronc_point:
          type: number
        tronc_amount:
          type: number
        tronc_rate:
          type: number
    HourlyRate:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        tronc_point:
          type: number
        tronc_amount:
          type: number
        tronc_rate:
          type: number
    DeprecatedTippedStatus:
      type: object
      properties:
        id:
          type: number
        is_tipped:
          type: boolean
        start_date:
          type: string
          format: date
    TippedStatus:
      type: object
      properties:
        id:
          type: number
        is_tipped:
          type: boolean
        start_date:
          type: string
          format: date
    DeprecatedEmployeePosition:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: integer
              nullable: true
              description: >-
                this field is nullable, it depends on pay type. this will be
                defined only if pay type is HOURLY and cross location mode is
                FLEXIBLE
            pay_rate:
              type: object
              allOf:
                - $ref: '#/components/schemas/DeprecatedPayRate'
              nullable: true
              description: >-
                this field is nullable, it depends on pay type. this will have
                value only if pay type is HOURLY
            is_tipped:
              type: boolean
              description: >-
                this field is nullable, it depends on pay type. this will have
                value only if pay type is HOURLY
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    DeprecatedEmployeePositionV2:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: integer
              nullable: true
              description: >-
                this field is nullable, it depends on pay type. this will be
                defined only if pay type is HOURLY and cross location mode is
                FLEXIBLE
            pay_rates:
              type: array
              items:
                $ref: '#/components/schemas/DeprecatedPayRateV2'
            is_tipped:
              type: boolean
              description: >-
                this field is nullable, it depends on pay type. this will have
                value only if pay type is HOURLY
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    DeprecatedAnnualRate:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    AnnualRate:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    DeprecatedTronc:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    DeprecatedTroncPoint:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    TroncPoint:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    DeprecatedTroncAmount:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    TroncAmount:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
    DeprecatedMaxWeeklyHours:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        working_pattern:
          nullable: true
          description: >
            Present only when the underlying Team service version returns a working pattern
            (i.e., for endpoints whose request validation accepts `working_pattern`).
            May be omitted or `null` otherwise.
          allOf:
            - $ref: '#/components/schemas/WorkingPattern'
    MaxWeeklyHours:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        working_pattern:
          nullable: true
          description: >
            Present only when the underlying Team service version returns a working pattern
            (i.e., for endpoints whose request validation accepts `working_pattern`).
            May be omitted or `null` otherwise.
          allOf:
            - $ref: '#/components/schemas/WorkingPattern'
    MaxWeeklyHoursV2:
      type: object
      properties:
        id:
          type: number
        start_date:
          type: string
          format: date
        average_weekly_hours:
          type: number
        working_patterns:
          type: array
          items:
            $ref: '#/components/schemas/WorkingPatternV2'
    WorkingPatternV2:
      type: object
      properties:
        id:
          type: number
        days_count:
          type: number
          nullable: true
          enum: [1, 2, 3, 4, 5, 6, 7]
        total_hours:
          type: number
        order:
          type: integer
        working_pattern_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingPatternDaysV2'
    WorkingPatternDaysV2:
      type: object
      properties:
        id:
          type: number
        day:
          type: string
          enum: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
        hours_count:
          type: number
          nullable: true
    DeprecatedMaxWeeklyHoursV2:
      type: object
      properties:
        id:
          type: number
        value:
          type: number
        start_date:
          type: string
          format: date
        working_pattern:
          nullable: true
          description: >
            Present only when the underlying Team service version returns a working pattern
            (i.e., for endpoints whose request validation accepts `working_pattern`).
            May be omitted or `null` otherwise.
          allOf:
            - $ref: '#/components/schemas/WorkingPattern'
    WorkingPattern:
      type: object
      properties:
        id:
          type: number
        days_count:
          type: number
          nullable: true
          description: >
            Number of working days per week. Allowed values: 1 to 7.
            Can be `null` when working days are defined explicitly in `working_pattern_days`.

          enum: [1, 2, 3, 4, 5, 6, 7]
        working_pattern_days:
          type: array
          description: >
            The distribution of working days. Can be an empty list if not specifying specific days.
            Each item defines the day and optionally the number of hours worked.

          items:
            $ref: '#/components/schemas/WorkingPatternDays'
      example:
        id: 101
        days_count: null
        working_pattern_days:
          - day: "MON"
            hours_count: 8
          - day: "WED"
            hours_count: 6
          - day: "FRI"
            hours_count: 4

    WorkingPatternDays:
      type: object
      properties:
        id:
          type: number
        day:
          type: string
          nullable: false
          enum: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
          description: >
            Day of the week. Must be one of: MON, TUE, WED, THU, FRI, SAT, SUN.
        hours_count:
          type: number
          nullable: true
          description: >
            Number of working hours on this day. Can be `null` if not specified.
      example:
        id: 1
        day: "SUN"
        hours_count: 8

    WorkingPatternV4:
      type: object
      description: >
        A single working pattern as returned in v4+ Max Weekly Hours responses.
        Each entry carries its own `total_hours` and `order`.
      properties:
        id:
          type: number
        days_count:
          type: number
          nullable: true
          description: >
            Number of working days per week. Can be `null` when working days are
            defined explicitly in `working_pattern_days`.
        total_hours:
          type: number
        order:
          type: integer
          description: Position of this working pattern within the list.
        working_pattern_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingPatternDays'
    MaxWeeklyHoursV4:
      type: object
      description: >
        Max Weekly Hours entry (v4+ shape) exposing a list of `working_patterns`
        and the derived `average_weekly_hours`.
      properties:
        id:
          type: number
        start_date:
          type: string
          format: date
        average_weekly_hours:
          type: number
        working_patterns:
          type: array
          items:
            $ref: '#/components/schemas/WorkingPatternV4'
    MaxWeeklyHoursWorkingPatternRequest:
      type: object
      description: A working pattern accepted when creating Max Weekly Hours (v4+ shape).
      properties:
        days_count:
          type: number
          nullable: true
        total_hours:
          type: number
        order:
          type: integer
        working_pattern_days:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                enum:
                - MON
                - TUE
                - WED
                - THU
                - FRI
                - SAT
                - SUN
              hours_count:
                type: number
                nullable: true
    MaxWeeklyHoursWorkingPatternUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/MaxWeeklyHoursWorkingPatternRequest'
      - type: object
        properties:
          id:
            type: integer
    DeprecatedAnnualPayRate:
      type: object
      properties:
        id:
          type: number
        rate:
          type: number
        tronc:
          type: number
    DeprecatedAnnualPayRateV2:
      type: object
      properties:
        id:
          type: number
        rate:
          type: number
        start_date:
          type: string
          format: date
    DeprecatedPayType:
      type: object
      properties:
        id:
          type: number
        employee_id:
          type: number
          nullable: true
        type:
          type: string
          enum:
            - SALARIED
            - HOURLY
            - WEIGHTED_SHIFT
        cross_location_mode:
          type: string
          enum:
            - FIXED
            - FLEXIBLE
          nullable: true
          description: >-
            this field is nullable, it depends on pay type. this will be defined
            only if pay type is HOURLY
        annual_pay_rate:
          $ref: '#/components/schemas/DeprecatedAnnualPayRate'
        max_weekly_hours:
          type: number
    PayType:
      type: object
      properties:
        id:
          type: number
        type:
          type: string
          enum:
            - SALARIED
            - HOURLY
            - WEIGHTED_SHIFT
        start_date:
          type: string
          format: date
        cross_location_edit_mode:
          type: string
          enum:
            - FIXED
            - FLEXIBLE
          nullable: true
          description: >-
            This field is nullable and depends on the pay type. It will only be
            defined if the pay type is set to HOURLY.
    DeprecatedEmployeePositionRelatedInfo:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: integer
            is_primary:
              type: boolean
              description: >-
                Indicates whether this position is the primary role for a user.
                This value is determined based on the existence of a
                PRIMARY_POSITION service.
            hourly_rate:
              $ref: '#/components/schemas/DeprecatedHourlyRate'
            tipped_status:
              $ref: '#/components/schemas/TippedStatus'
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    DeprecatedEmployeePositionRelatedInfoV2:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: string
            is_primary:
              type: boolean
              description: >-
                Indicates whether this position is the primary role for a user.
                This value is determined based on the existence of a
                PRIMARY_POSITION service.
            hourly_rate:
              $ref: '#/components/schemas/HourlyRate'
            tipped_status:
              $ref: '#/components/schemas/TippedStatus'
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    EmployeePositionRelatedInfo:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: integer
            is_primary:
              type: boolean
              description: >-
                Indicates whether this position is the primary role for a user.
                This value is determined based on the existence of a
                PRIMARY_POSITION service.
            hourly_rate:
              $ref: '#/components/schemas/HourlyRate'
            tipped_status:
              $ref: '#/components/schemas/TippedStatus'
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    BasicEmployeePositionRelatedInfo:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            location_id:
              type: integer
            is_primary:
              type: boolean
              description: >-
                Indicates whether this position is the primary role for a user.
                This value is determined based on the existence of a
                PRIMARY_POSITION service.
            hourly_rate:
              $ref: '#/components/schemas/HourlyRate'
            tipped_status:
              $ref: '#/components/schemas/TippedStatus'
    DeprecatedPayRate:
      type: object
      properties:
        id:
          type: number
        rate:
          type: number
        tronc:
          type: number
    DeprecatedPayRateV2:
      type: object
      properties:
        id:
          type: number
        rate:
          type: number
        start_date:
          type: string
          format: date
        tronc:
          type: number
    EmployeePosition:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            id:
              type: number
            location_id:
              type: integer
            is_primary:
              type: boolean
              description: >-
                Indicates whether this position is the primary role for a user.
                This value is determined based on the existence of a
                PRIMARY_POSITION service.
            cost_centers:
              type: array
              items:
                $ref: '#/components/schemas/CostCenter'
    DeprecatedPayTypeV2:
      type: object
      properties:
        id:
          type: number
        employee_id:
          type: number
          nullable: true
        type:
          type: string
          enum:
            - SALARIED
            - HOURLY
            - WEIGHTED_SHIFT
        cross_location_mode:
          type: string
          enum:
            - FIXED
            - FLEXIBLE
          nullable: true
          description: >-
            this field is nullable, it depends on pay type. this will be defined
            only if pay type is HOURLY
        annual_pay_rates:
          type: array
          items:
            $ref: '#/components/schemas/DeprecatedAnnualPayRateV2'
        tronc:
          type: number
        max_weekly_hours:
          type: number
    EmployeeBasicInfo:
      type: object
      properties:
        id:
          type: string
          example: '1'
          description: A unique ID provided by customers or third-parties
        email:
          type: string
          format: email
          description: employee email
        first_name:
          type: string
          description: employee first name
        last_name:
          type: string
          description: employee last name
        middle_name:
          type: string
          description: employee middle name
        geid:
          type: string
        birth_date:
          type: string
          format: date
          description: employee birth date
        phone:
          type: string
          format: phone
          description: employee phone number
        home_phone:
          type: string
          format: phone
          description: home phone number
        blocked_from_rehire:
          type: boolean
        known_as:
          type: string
    DeprecatedCreatedEmployee:
      allOf:
        - $ref: '#/components/schemas/EmployeeBasicInfo'
        - type: object
          properties:
            user_id:
              type: number
              nullable: true
            gender:
              type: string
              enum:
                - MALE
                - FEMALE
                - NO_IDENTIFY
              description: employee gender
            national_number:
              type: string
              description: National number
            financial_unit_location_id:
              type: integer
            status:
              type: string
              enum:
                - ACTIVE
                - TERMINATED
            address:
              $ref: '#/components/schemas/Address'
            employer:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: employer email
                first_name:
                  type: string
                  description: employer first name
                last_name:
                  type: string
                  description: employer last name
            employment_period:
              $ref: '#/components/schemas/EmploymentPeriod'
            job_titles:
              type: array
              items:
                $ref: '#/components/schemas/EmployeeJobTitle'
            vsl:
              type: string
              enum:
                - IN
                - OUT
            locations:
              type: array
              items:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Location'
                  - type: object
                    properties:
                      is_primary:
                        type: boolean
                      is_active:
                        type: boolean
                      payroll_id:
                        type: string
                      pos_id:
                        type: string
                      location_periods:
                        type: array
                        items:
                          $ref: '#/components/schemas/LocationPeriod'
            positions:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Position'
                  - type: object
                    properties:
                      id:
                        type: number
                      location_id:
                        type: integer
                      is_primary:
                        type: boolean
                      hourly_rates:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeprecatedHourlyRate'
                      tipped_statuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/TippedStatus'
                      cost_centers:
                        type: array
                        items:
                          $ref: '#/components/schemas/CostCenter'
            pay_types:
              type: array
              items:
                $ref: '#/components/schemas/PayType'
            annual_rates:
              type: array
              items:
                $ref: '#/components/schemas/AnnualRate'
            troncs:
              type: array
              items:
                $ref: '#/components/schemas/DeprecatedTronc'
            max_weekly_hours:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                  value:
                    type: number
                  start_date:
                    type: string
                    format: date
            bank_account:
              type: object
              properties:
                id:
                  type: number
                routing_number:
                  type: string
                account_number:
                  type: string
                registration_number:
                  type: string
                account_type:
                  type: string
                  enum:
                    - SAVINGS
                    - CHECKING
                bank_name:
                  type: string
                account_name:
                  type: string
                sort_code:
                  type: string
              required:
                - account_number
    DeprecatedCreatedEmployeeV2:
      allOf:
        - $ref: '#/components/schemas/EmployeeBasicInfo'
        - type: object
          properties:
            user_id:
              type: number
              nullable: true
            gender:
              type: string
              enum:
                - MALE
                - FEMALE
                - NO_IDENTIFY
              description: employee gender
            national_number:
              type: string
              description: National number
            financial_unit_location_id:
              type: integer
            status:
              type: string
              enum:
                - ACTIVE
