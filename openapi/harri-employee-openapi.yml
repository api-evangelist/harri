paths:
  /api/v1/positions:
    get:
      tags:
        - Position
      summary: Retrieve all positions API
      description: Retrieve all positions
      operationId: GetAllPositions
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Position'
                    - type: object
                      properties:
                        id:
                          type: string
  /api/v1/locations:
    get:
      tags:
        - Location
      summary: Retrieve all locations API
      description: Retrieve all locations
      operationId: GetAllLocations
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Location'
                    - type: object
                      properties:
                        type:
                          type: string
  /api/v1/locations/{location_id}/cost_centers:
    get:
      tags:
        - CostCenters
      summary: List Cost Centers
      description: Retrieves a list of cost centers for a specific location.
      operationId: GetLocationCostCenters
      parameters:
        - in: path
          name: location_id
          required: true
          description: Unique identifier for the location.
          schema:
            type: string
      responses:
        '200':
          description: A list of cost centers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cost_centers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2848
                        name:
                          type: string
                          example: Test
                        code:
                          type: string
                          example: Temp Dept
                        mode:
                          type: string
                          example: LOCKED
                        values:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2849
                              name:
                                type: string
                                example: Front of House
                              code:
                                type: string
                                example: FOH
                              mode:
                                type: string
                                example: LOCKED
                              priority:
                                type: integer
                                nullable: true
                                example: null
  /api/v1/job_titles:
    get:
      tags:
        - JobTitle
      summary: Retrieve all job titles
      description: Retrieve all job titles
      operationId: GetAllJobTitles
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/JobTitle'
                    - type: object
                      properties:
                        color:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
  /api/v3/employees:
    post:
      deprecated: true
      tags:
        - Deprecated Employee
      summary: Deprecated create employee API
      description: Deprecated create employee
      operationId: DeprecatedCreateEmployee
      requestBody:
        description: employee
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: >-
                    A unique ID provided by customers or third-parties. When not
                    supplied, Harri will generate one. Only supported if
                    external mapping is allowed for the client.
                email:
                  type: string
                  format: email
                  description: >-
                    If phone number is not provided, employee email must be
                    provided.
                first_name:
                  type: string
                  description: employee first name
                last_name:
                  type: string
                  description: employee last name
