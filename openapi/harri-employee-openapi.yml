  /api/v4/employees/{employeeId}/rehire:
    post:
      deprecated: true
      tags:
        - Deprecated Employment
      summary: rehire employee API
      description: rehire employee
      operationId: RehireEmployeeV4
      parameters:
        - name: employeeId
          in: path
          description: employee id
          required: true
          schema:
            type: string
      requestBody:
        description: employment info
        content:
          application/json:
            schema:
              type: object
              properties:
                location_id:
                  type: string
                hire_date:
                  type: string
                  format: date
                pay_type:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - SALARIED
                        - HOURLY
                        - WEIGHTED_SHIFT
                    cross_location_mode:
                      type: string
                      enum:
                        - FIXED
                        - FLEXIBLE
                      nullable: true
                      description: >-
                        this should be defined only when the pay type    is
                        HOURLY
                  required:
                    - type
                max_weekly_hours:
                  type: object
                  properties:
                    value:
                      type: number
                    working_pattern:
                      type: object
                      description: >
                        Defines the employee's working pattern. The value depends on the enabled options:
                        - If the WORKING_PATTERN service is **disabled**, the value should be omitted or set to `null`.
                        - Option 1: Specific hours with non-specific days → `{"days_count": 1, "working_pattern_days": []}`
                        - Option 2: Specific hours with flexible days → `{"days_count": null, "working_pattern_days": [{"day": "SUN", "hours_count": null}]}`
                        - Option 3: Specific hours with specific days → `{"days_count": null, "working_pattern_days": [{"day": "SUN", "hours_count": 8}]}`
                      properties:
                        days_count:
                          type: number
                          nullable: true
                          description: The number of working days per week value enum(1, 2, 3, 4, 5, 6, 7), it can be null but the key is required to be sent
                        working_pattern_days:
                          type: array
                          description: >
                            The distribution of working days. Can be an empty list if not specifying specific days.
                            Each item defines the day and optionally the number of hours worked.
                          items:
                            type: object
                            properties:
                              day:
                                type: string
                                nullable: false
                              hours_count:
                                type: number
                                nullable: true
                                description: The number of hours per day, it can be null but the key is required to be sent
                            required:
                              - day
                      required:
                        - days_count
                  required:
                    - value
                position:
                  type: object
                  properties:
                    code:
                      type: string
                    tipped_status:
                      type: object
                      properties:
                        is_tipped:
                          type: boolean
                      required:
                        - is_tipped
                      description: >-
                        Shouldn't be sent when the pay type is set to SALARIED
                        or WEIGHTED_SHIFT.
                    hourly_rate:
                      type: object
                      properties:
                        value:
                          type: number
                        tronc_point:
                          type: number
                        tronc_rate:
                          type: number
                        tronc_amount:
                          type: number
                      required:
                        - value
                  required:
                    - code
                tronc_point:
                  type: object
                  properties:
                    value:
                      type: number
                  required:
                    - value
                annual_rate:
                  type: object
                  properties:
                    value:
                      type: number
                  required:
                    - value
                tronc_amount:
                  type: object
                  properties:
                    value:
                      type: number
                  required:
                    - value
