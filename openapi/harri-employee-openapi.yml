    put:
      tags:
        - Franchisee BankAccounts
      summary: Update or create employee bank account API
      description: Update or create employee bank account
      operationId: FranshiseesUpdateEmployeeBankAccount
      parameters:
        - name: franchiseeId
          in: path
          required: true
          schema:
            type: number
        - name: employeeId
          in: path
          description: employee id
          required: true
          schema:
            type: string
      requestBody:
        description: bank account
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  order:
                    type: number
                    minimum: 1
                    description: >-
                      the order of the employee's bank account. An order value
                      of 1 signifies that this is the primary bank account.
                  routing_number:
                    type: string
                    description: >-
                      required for US locations, can't be set for other
                      locations
                  account_number:
                    type: string
                  registration_number:
                    type: string
                    description: required for DK locations
                  account_type:
                    type: string
                    enum:
                      - SAVINGS
                      - CHECKING
                    description: required for US, cant be set for other locations
                  bank_name:
                    type: string
                  account_name:
                    type: string
                    description: required for other non US locations
                  sort_code:
                    type: string
                    description: required for other non US locations
                  deposit_amount_type:
                    type: string
                    enum:
                      - ENTIRE
                      - PARTIAL
                      - FIXED
                    description: Specifies the type of deposit amount.
                  amount:
                    type: string
                    description: >-
                      Represents the amount of money if deposit_amount_type is
                      FIXED, the percentage if deposit_amount_type is PARTIAL,
                      and is null if deposit_amount_type is ENTIRE.
                required:
                  - account_number
                  - order
      responses:
        '200':
          description: successful updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '201':
          description: successful updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '400':
          description: Invalid ID supplied
        '404':
          description: employee not found
          content: {}
