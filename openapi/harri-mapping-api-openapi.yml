openapi: 3.2.0
info:
  title: Harri Mapping API
  termsOfService: https://harri.com/terms
  version: '1.0'
  description: 'Operations tagged Mapping across 2 of this provider''s published API definitions: harri-employee-openapi.yml, harri-employer-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gateway.harri.com/open-api-hub
tags:
- name: Mapping
paths:
  /api/v1/employees/mappings:
    servers:
    - url: https://gateway.harri.com/open-api-hub
    get:
      parameters:
      - name: internal_values
        in: query
        schema:
          type: array
          items:
            type: string
      - name: external_values
        in: query
        schema:
          type: array
          items:
            type: string
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - UNMAPPED
      - name: unmapped_employees_limit
        in: query
        description: Specifies the maximum number of unmapped employees to return. Must be between 1 and 1000. Defaults to 1000 if not specified.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      operationId: api_v1_employees_mappings_list
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - internal_value
                  - external_value
                  properties:
                    id:
                      type: number
                    internal_value:
                      type: string
                      description: Mapper internal code
                    external_value:
                      type: string
                      description: Mapper external code
                    meta:
                      type: object
                      description: this is an optinal object returned for UNMAPPED mode
                      properties:
                        first_name:
                          type: string
                          description: employee first name
                        last_name:
                          type: string
                          description: employee last name
                        ssn:
                          type: string
                          description: ssn
                        phone:
                          type: string
                          format: phone
                          description: employee phone number
                        email:
                          type: string
                          format: email
                          description: employee email
                        external_middleware_id:
                          type: string
                          description: external middleware id
      tags:
      - Mapping
    post:
      operationId: api_v1_employees_mappings_create
      description: ''
      requestBody:
        description: Create Mapping
        content:
          application/json:
            schema:
              type: object
              properties:
                mappings:
                  type: array
                  items:
                    type: object
                    properties:
                      internal_value:
                        type: string
                        description: must be valid employee id
                      external_value:
                        type: string
                    required:
                    - internal_value
                    - external_value
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapperData'
      tags:
      - Mapping
  /api/v2/employees/mappings:
    servers:
    - url: https://gateway.harri.com/open-api-hub
    get:
      parameters:
      - name: location_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: IDs of locations where the requested employees are currently active
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - UNMAPPED
      - name: limit
        required: true
        in: query
        description: Specifies the number of mapped or unmapped employees to return. Must be between 1 and 7000. Defaults to 7000 if not specified.
        schema:
          type: integer
          minimum: 1
          maximum: 7000
          default: 7000
      - name: page
        in: query
        required: true
        description: Page number
        schema:
          type: integer
          minimum: 1
          default: 1
      operationId: api_v2_employees_mappings_list
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings:
                    type: array
                    items:
                      type: object
                      required:
                      - internal_value
                      - external_value
                      properties:
                        id:
                          type: number
                          description: Returned for mapped employees
                        internal_value:
                          type: string
                          description: Mapper internal code
                        external_value:
                          type: string
                          description: Mapper external code
                        meta:
                          type: object
                          description: this is an optinal object returned for UNMAPPED mode
                          properties:
                            first_name:
                              type: string
                              description: employee first name
                            last_name:
                              type: string
                              description: employee last name
                            ssn:
                              type: string
                              description: ssn
                            phone:
                              type: string
                              format: phone
                              description: employee phone number
                            email:
                              type: string
                              format: email
                              description: employee email
                            external_middleware_id:
                              type: string
                              description: external middleware id
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
      tags:
      - Mapping
  /api/v1/employees/mappings/{id}:
    parameters:
    - name: id
      in: path
      schema:
        type: integer
        format: int64
      required: true
    servers:
    - url: https://gateway.harri.com/open-api-hub
    put:
      operationId: api_v1_employees_mappings_update
      description: ''
      requestBody:
        description: Update Mapping
        content:
          application/json:
            schema:
              properties:
                internal_value:
                  type: string
                  description: must be valid employee id
                external_value:
                  type: string
              required:
              - internal_value
              - external_value
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMapper'
      tags:
      - Mapping
