components:
  schemas:
    MapperData:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              internal_value:
                type: string
                description: Mapper internal code
              external_value:
                type: string
                description: Mapper external code
    Mapping:
      type: object
      properties:
        internal_value:
          type: string
        external_value:
          type: string
    UpdateMapper:
      type: object
      properties:
        data:
          type: string
          enum:
          - Success
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://oauth.harri.com/oauth2/token
          scopes: {}
externalDocs:
  description: Find out more about Harri
