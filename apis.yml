apis:
- aid: harri:employee-api
  name: Harri Employee API
  description: 'The Harri Employee API is the core of the Harri Open API Hub. It manages
    and retrieves employee data across the Harri platform: employee create/read/update,
    employee profiles, location attachment and location periods, job titles, positions
    and primary positions, pay types, hourly rates, annual rates, tipped statuses,
    tronc points and amounts, bank accounts, employment periods, absences, max weekly
    hours and working patterns, minor details, cost centers, external ID mappings,
    platform events and client subscriptions. Every corporate resource is mirrored
    under a /franchisees/{franchiseeId}/ path set for franchise operators. The spec
    is heavily versioned in the URI path (v1 through v6) with 150 of its 363 operations
    explicitly flagged deprecated.'
  humanURL: https://developer.harri.com/employees/
  baseURL: https://gateway.harri.com/open-api-hub
  tags:
  - Employees
  - Workforce Management
  - Human Resources
  - Scheduling
  - Payroll
  properties:
  - type: OpenAPI
    url: openapi/harri-employee-openapi.yml
  - type: Documentation
    url: https://developer.harri.com/employees/
  - type: Overlay
    url: overlays/harri-employee-overlay.yaml
- aid: harri:employer-api
  name: Harri External Brand Management API
  description: 'The Harri Employer (External Brand Management) API creates and manages
    Harri above-store admin users and employer/brand records. It provides v1 user
    CRUD keyed on an external user id, v2 employer CRUD, a mappings listing that
    reconciles Harri identifiers with external system identifiers, and a mirrored
    franchisee-scoped path set. Corporate IDs must be associated with the calling
    API credentials by Harri Support before the endpoints resolve, otherwise a 422
    is returned.'
  humanURL: https://developer.harri.com/employer/
  baseURL: https://gateway.harri.com/open-api-hub
  tags:
  - Employers
  - Brand Management
  - User Management
  - Human Resources
  properties:
  - type: OpenAPI
    url: openapi/harri-employer-openapi.json
  - type: Documentation
    url: https://developer.harri.com/employer/
  - type: Overlay
    url: overlays/harri-employer-overlay.yaml
