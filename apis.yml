aid: harri
name: Harri
description: 'Harri is a hospitality-first human capital management (HCM) and workforce
  management platform used by enterprise restaurants, hotels, retailers, grocers and
  care operators to run the full employee lifecycle — talent acquisition and onboarding,
  scheduling and demand forecasting, time and attendance, labor compliance, payroll
  data export and workforce analytics. Harri exposes a public Open API Hub through
  its developer portal at developer.harri.com, secured with OAuth 2.0 client credentials
  and fronted by an API gateway at gateway.harri.com. The published surface covers
  employee records, locations, positions, job titles, pay types, hourly and annual
  rates, tronc and tip distribution, employment periods, absences, max weekly hours
  and working patterns, external-system ID mappings, platform events and webhook
  subscriptions, plus an employer/brand-management surface for above-store admin
  users. A parallel franchisee-scoped path set mirrors the corporate endpoints for
  multi-brand and franchise operators.'
image: https://cdn.harri.com/10c3cd15-ec51-41c0-ba18-3227e664ad83/images/icons/apple-touch-icon.png
