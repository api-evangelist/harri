format: http-status
notes:
- Harri does not publish RFC 9457 application/problem+json responses. Every 4xx response in both published
  OpenAPI documents carries a plain-text description only — no error schema, no error code registry, and
  no response content object. The titles below are the descriptions verbatim from the spec.
- The Harri Employee OpenAPI info.description documents rate limiting as HTTP 403 with an explanatory
  body, changing to HTTP 429 after 4 June 2026. Neither 403-rate-limit nor 429 is modeled as a response
  on any operation in the spec.
- The Harri Employer OpenAPI info.description documents a 422 returned when a corporate ID is not associated
  with the calling API credentials. 422 is not modeled as a response on any operation.
- The authentication doc documents HTTP 401 Unauthorized for bad/expired credentials. 401 is not modeled
  as a response on any operation in either spec.
